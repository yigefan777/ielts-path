const $=id=>document.getElementById(id),el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e},letters='ABCDEFGHI',names={listening:'听力',reading:'阅读',writing:'写作',speaking:'口语'},STORE='ielts-path-c21-a-t1-computer-v2',OLD='ielts-path-c21-a-t1-preview-v1';

function richInline(group){const box=el('div','inline-body');box.innerHTML=group.html;const walker=document.createTreeWalker(box,NodeFilter.SHOW_TEXT);const texts=[];while(walker.nextNode())if(/\{\{\d+\}\}/.test(walker.currentNode.textContent))texts.push(walker.currentNode);for(const t of texts){const frag=document.createDocumentFragment(),regex=/\{\{(\d+)\}\}/g;let last=0,m;while((m=regex.exec(t.textContent))){frag.append(document.createTextNode(t.textContent.slice(last,m.index)));const n=+m[1];frag.append(input(n,skill==='reading'&&n>=31&&n<=36?letters.split(''):null));last=regex.lastIndex}frag.append(document.createTextNode(t.textContent.slice(last)));t.replaceWith(frag)}return box}

 if(g.type==='match')block.append(optionList(g.options));for(const item of g.items){const q=el('div','question');q.dataset.question=item.id;q.id='q-'+item.id;if(g.type==='choice'){q.append(el('strong','q-label',`${item.id}. ${item.text}`));const list=el('div','options'),isJudgement=item.options[0]==='TRUE'||item.options[0]==='YES';item.options.forEach((t,i)=>{const l=el('label','option'),radio=el('input');radio.type='radio';radio.name=`${skill}-${item.id}`;radio.value=isJudgement?t:letters[i];radio.checked=state.answers[skill][item.id-1]===radio.value;radio.disabled=submitted();radio.setAttribute('aria-label',`${names[skill]}第${item.id}题 ${isJudgement?t:letters[i]+' '+t}`);radio.onchange=()=>change(item.id,radio.value);radio.onfocus=()=>focusQuestion(item.id);l.append(radio,el('span','',isJudgement?t:`${letters[i]}  ${t}`));list.append(l)});q.append(list)}else{q.classList.add('matching');const label=el('label','',`${item.id}. ${item.text}`);const select=el('select');select.id=`match-${skill}-${item.id}`;label.htmlFor=select.id;select.setAttribute('aria-label',`${names[skill]}第${item.id}题`);select.append(el('option','','选择…'));select.firstChild.value='';g.options.forEach((o,i)=>{const opt=el('option','',letters[i]);opt.value=letters[i];select.append(opt)});select.value=state.answers[skill][item.id-1];select.disabled=submitted();select.onchange=()=>change(item.id,select.value);select.onfocus=()=>focusQuestion(item.id);q.append(label,select)}feedback(q,item.id);block.append(q)}return block}
function passageContent(section){const article=el('div','reading-text');const text=section.passage;const lines=text.split('\n');const title=section.title;article.append(el('h1','',title));let body=text.replace(/^The Davies Sisters\n/,'').replace(/^Why we need silence\n/,'').replace(/^Book review: The World of Sugar by\nUlbe Bosma\n/,'');let paragraphs=[];if(part===0){const starts=['Between 1908','Gwendoline (','While there','The sisters began','The sisters’ journals','The sisters\' journals','However, it','The First World','It was tedious','Commentators','By the early','The sisters collected','*** Impressionist:','• philanthropic:','•• Old Master:'];let acc='';for(const line of body.split('\n')){if(starts.some(s=>line.startsWith(s))&&acc){paragraphs.push(acc);acc=''}acc+=(acc?' ':'')+line}if(acc)paragraphs.push(acc)}else if(part===1){let acc='';for(const line of body.split('\n')){if(/^[A-G] /.test(line)&&acc){paragraphs.push(acc);acc=''}acc+=(acc?' ':'')+line}if(acc)paragraphs.push(acc)}else{let acc='';for(const line of body.split('\n')){if(/^(Ulbe Bosma|Bosma’s|Bosma's|The book|The World|This is also|But sugar|Where once|This is a wonderfully)/.test(line)&&acc){paragraphs.push(acc);acc=''}acc+=(acc?' ':'')+line}if(acc)paragraphs.push(acc)}for(const p of paragraphs)article.append(el('p','',p));return article}
function stopRecording(){if(recorder?.state==='recording')recorder.stop();stream?.getTracks().forEach(t=>t.stop())}
function recordingControls(container){const row=el('div','record-controls'),b=el('button','primary',recorder?.state==='recording'?'停止录音':'开始录音'),a=el('audio'),link=el('a','','下载录音');a.id='recordAudio';a.controls=true;a.hidden=!recordedUrl;a.src=recordedUrl;link.hidden=!recordedUrl;link.href=recordedUrl;link.download='c21-speaking.webm';b.onclick=async()=>{if(recorder?.state==='recording'){stopRecording();return}try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error();stream=await navigator.mediaDevices.getUserMedia({audio:true});if(skill!=='speaking'){stopRecording();return}recorder=new MediaRecorder(stream);const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{if(recordedUrl)URL.revokeObjectURL(recordedUrl);recordedUrl=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));a.src=recordedUrl;a.hidden=false;link.href=recordedUrl;link.hidden=false;link.download='c21-speaking.'+(recorder.mimeType.includes('mp4')?'m4a':'webm');stream?.getTracks().forEach(t=>t.stop());b.textContent='重新录音'};recorder.start();b.textContent='停止录音'}catch{stopRecording();toast('无法使用麦克风，请检查权限或使用文字复盘。')}};row.append(b,link);container.append(row,a,el('p','muted','录音仅保留在当前页面，请下载备份；文字自动保存。'))}
function render(){if(!bank)return;highlightRange=null;const section=bank[skill][part],objective=!!section.range;$('main').className=skill==='listening'?'single':'';$('passage').replaceChildren();$('questions').replaceChildren();$('partTitle').textContent=`${section.name}${objective?' · Questions '+section.range.join('–'):''}`;$('partInstruction').textContent=skill==='speaking'?'口语为面试形式，此处提供口语练习，不计作机考项目。':skill==='listening'?'完成本部分题目，可通过底部题号切换。音频为可回放的练习模式。':'本机练习 · 草稿自动保存 · 非官方考试平台';$('audio').hidden=skill!=='listening';if(skill==='listening'){$('audio').src=section.audio;$('audio').load()}$('widthLabel').hidden=skill==='listening';$('highlight').hidden=skill==='listening';$('clearMarks').hidden=skill==='listening';$('finish').textContent=submitted()?'继续订正':`提交${names[skill]}`;
 document.querySelectorAll('[data-skill]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.skill===skill));b.tabIndex=b.dataset.skill===skill?0:-1});const qs=$('questions'),ps=$('passage');
 if(objective){if(skill==='listening'&&part===1)qs.append(el('h1','','Working as a makeup trainee'));if(submitted()){const result=el('div','results');result.append(el('strong','',`${score(skill).filter(Boolean).length} / 40`),el('div','',`已核对${names[skill]}整科 · 原始正确题数，不换算雅思分数。`));qs.append(result)}if(skill==='reading'){ps.append(passageContent(section));restoreMarks()}for(const g of section.groups)qs.append(renderGroup(g));}
 else if(skill==='writing'){ps.append(el('h1','',`WRITING ${section.name.toUpperCase()}`),el('p','instruction',`You should spend about ${part===0?20:40} minutes on this task.`),el('h2','',section.prompt),el('p','',section.instruction));if(section.chart){const im=el('img','chart');im.src=section.chart;im.alt='Number of jobs in four sectors of the economy in the US, 1960–2020';ps.append(im)}ps.append(el('p','',`Write at least ${section.minimum} words.`));restoreMarks();qs.append(el('h2','',section.name+' · Your answer'));const count=el('div','word-count');count.id='wordCount';const ta=el('textarea','essay');ta.setAttribute('aria-label',section.name+' 作文');ta.spellcheck=false;ta.maxLength=30000;ta.value=state.writing[part];ta.disabled=submitted();const wordcount=()=>count.textContent=`Word count: ${ta.value.trim()?ta.value.trim().split(/\s+/).length:0}`;wordcount();ta.oninput=()=>{state.writing[part]=ta.value;wordcount();save();updateNav()};qs.append(count,ta);if(submitted())qs.prepend(el('div','results','两篇作文已保存。写作需另行评价，本版不提供自动评分。'))}
 else{ps.append(el('h1','',`SPEAKING ${section.name.toUpperCase()}`));const cue=el('div','cue');cue.append(el('h2','',section.topic));if(part===1)cue.append(el('p','','You should say:'));const ul=el('ul');section.prompts.forEach(p=>ul.append(el('li','',p)));cue.append(ul);ps.append(cue);if(part===1)ps.append(el('p','muted','You have 1 minute to prepare. Talk for 1–2 minutes.'));restoreMarks();qs.append(el('h2','','录音与复盘'));recordingControls(qs);const ta=el('textarea','essay');ta.setAttribute('aria-label','口语复盘笔记');ta.placeholder='记录回答要点与回听后的改进…';ta.maxLength=30000;ta.value=state.speaking;ta.disabled=submitted();ta.oninput=()=>{state.speaking=ta.value;save()};qs.append(ta);}

function updateNav(){if(!bank)return;$('parts').replaceChildren();bank[skill].forEach((section,i)=>{const b=el('button',i===part?'selected':'',section.name);b.setAttribute('aria-current',i===part?'true':'false');if(section.range){const [a,z]=section.range;const done=state.answers[skill].slice(a-1,z).filter(x=>x.trim()).length;b.append(el('small','',`${done}/${z-a+1}`));b.setAttribute('aria-label',`${section.name}，已答${done}/${z-a+1}`)}b.onclick=()=>{part=i;current=section.range?section.range[0]:i+1;render()};$('parts').append(b)});$('numbers').replaceChildren();const objective=skill==='listening'||skill==='reading',flags=state.flags[skill]||[];if(objective){const marks=submitted()?score(skill):null;for(let n=1;n<=40;n++){const b=el('button','number',String(n));b.classList.toggle('answered',!!state.answers[skill][n-1].trim());b.classList.toggle('current',current===n);b.classList.toggle('flagged',flags.includes(n));if(marks)b.classList.add(marks[n-1]?'good':'bad');b.setAttribute('aria-label',`第${n}题${state.answers[skill][n-1]?'，已答':'，未答'}${flags.includes(n)?'，待检查':''}`);if(current===n)b.setAttribute('aria-current','true');b.onclick=()=>locate(n);$('numbers').append(b)}$('counter').textContent=`${state.answers[skill].filter(x=>x.trim()).length} / 40 answered`;document.querySelectorAll('[data-question]').forEach(q=>{q.classList.toggle('active',+q.dataset.question===current)})}else{$('counter').textContent=skill==='writing'?'作文按任务分别保存':'口语练习'}$('flag').hidden=!objective;$('flag').setAttribute('aria-pressed',String(flags.includes(current)));$('flag').textContent=flags.includes(current)?'⚑ 已标记':'⚑ 标记待检查';}
function restoreMarks(){const key=skill+'-'+part;const marks=state.marks[key];if(!Array.isArray(marks))return;const root=$('passage');for(const m of marks){if(typeof m!=='string'||!m)continue;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let t;while((t=walker.nextNode())){if(t.parentElement.closest('mark'))continue;const i=t.textContent.indexOf(m);if(i<0)continue;const range=document.createRange();range.setStart(t,i);range.setEnd(t,i+m.length);const mark=el('mark');range.surroundContents(mark);break;}}}
document.addEventListener('selectionchange',()=>{const sel=window.getSelection();if(sel.rangeCount&&sel.toString().trim()){const r=sel.getRangeAt(0);if($('passage').contains(r.commonAncestorContainer))highlightRange=r.cloneRange()}});
$('highlight').onmousedown=e=>e.preventDefault();$('highlight').onclick=()=>{if(!highlightRange){toast('先在左侧原文选中一段文字，再点高亮。');return}try{const text=highlightRange.toString();if(!text.trim()||text.length>3000){toast('请选择一段不超过3000字的文字');return}const mark=el('mark');highlightRange.surroundContents(mark);const key=skill+'-'+part;(state.marks[key]||(state.marks[key]=[])).push(text);save();window.getSelection().removeAllRanges();highlightRange=null}catch{toast('请在同一个段落内选中文字。')}};$('clearMarks').onclick=()=>{state.marks[skill+'-'+part]=[];$('passage').querySelectorAll('mark').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));$('passage').normalize();save()};
function submit(auto=false){if(submitted()){state.submitted[skill]=false;save();render();toast('可继续订正，需再次提交核对');return}const objective=skill==='listening'||skill==='reading';if(!auto&&!confirm(objective?`提交${names[skill]}整科？还有 ${state.answers[skill].filter(x=>!x.trim()).length} 题未答，空白按错误计。`:`保存并结束本次${names[skill]}练习？`))return;pause();$('audio').pause();if(recorder?.state==='recording')stopRecording();state.submitted[skill]=true;save();render();toast(auto?'时间已到，已保存并结束本次练习。':'已保存，点击“继续订正”可继续修改。')}
