</style></head><body><header><div class="brand">IELTS <span>Path</span></div><span class="tag">题库导入 · 本机测试版</span><div class="spacer"></div><button id="catalogButton">查看资料分类</button><button id="practiceButton" class="primary">Test 1 试练</button></header><main class="shell"><div class="heading"><div><div class="eyebrow">YOUR LIBRARY / CAMBRIDGE IELTS</div><h1 id="title">剑桥雅思 21 · Academic · Test 1</h1><p id="subtitle">原书题页与听力音频已关联，先完整走一遍练习流程。</p></div><div><button id="clockButton" class="timer">开始计时 · 00:00</button> <button id="exportButton">导出本次记录</button></div></div><section id="practice"><div class="tabs" role="tablist" aria-label="练习科目"><button role="tab" data-skill="listening">01 听力</button><button role="tab" data-skill="reading">02 阅读</button><button role="tab" data-skill="writing">03 写作</button><button role="tab" data-skill="speaking">04 口语</button></div><div class="notice">个人资料测试版 · 草稿自动保存在当前浏览器，可导出备份；暂未接入正式云端记录。听读核对原始正确题数，不换算雅思分数。</div><div class="workspace"><section class="panel"><div class="toolbar"><strong id="paperTitle">原书题页</strong><button id="zoomButton" aria-pressed="false">放大题页</button><button id="prev">上一组</button><span id="position" class="muted"></span><button id="next">下一组</button></div><div id="paper" class="paper"></div></section><section class="panel"><div class="toolbar"><strong id="answerTitle">作答区</strong><span id="saveStatus" class="muted" role="status">正在恢复草稿</span></div><div class="answer-body" id="answerBody"></div><div class="answer-actions"><span id="completion" class="muted"></span><div class="spacer"></div><button id="saveButton">保存草稿</button><button id="submitButton" class="primary">提交并核对答案</button></div></section></div></section><section id="catalog" hidden><div class="catalog-note"><h2 id="inventoryTitle">正在读取分类</h2><p>按现有文件建立索引，原文件保持原位。文件已分类不代表试卷内容已全部导入。</p><div id="inventoryNotes"></div><a class="download" href="inventory.json" download>下载完整文件清单 JSON</a></div><div id="cards" class="cards"></div></section></main><footer>本次仅开放剑 2  else{body.append(el('p','muted',skill==='writing'?'对照左侧原书题目作答，图表保持原样。':'查看左侧 Part 1–3 题目，录音回听后写下复盘。'));
